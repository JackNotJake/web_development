# render.yaml — Render.com 一键部署 Blueprint
# 用法:
#   1. 在 Render Dashboard 创建 Web Service,选择本 Git 仓库。
#   2. 实例类型选择 Free。
#   3. 在部署配置中填入 FOOTBALL_DATA_TOKEN(从 football-data.org 获取)。
#   4. Render 会自动构建 Dockerfile 并启动服务。
# 注意:Free 实例无持久化磁盘,SQLite 数据在重新部署/休眠后会重置;课程演示足够。

services:
  - type: web
    name: football-app
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        value: 'file:./prisma/dev.db'
      - key: JWT_SECRET
        generateValue: true
      - key: FOOTBALL_DATA_TOKEN
        sync: false
    healthCheckPath: /health
